<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVCharging Network Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .status-dot {
            height: 15px;
            width: 15px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        .green {
            background-color: #28a745;
        }

        .red {
            background-color: #dc3545;
        }

        .orange {
            background-color: #fd7e14;
        }

        .gray {
            background-color: #6c757d;
        }

        .blue {
            background-color: #007bff;
        }
    </style>
</head>

<body>
    <h1>EVCharging Network Status</h1>
    <div id="dashboard">
        Loading...
    </div>

    <script>
        function getStatusColor(status) {
            switch (status) {
                case 'AVAILABLE': return 'green';
                case 'CONNECTED': return 'blue';
                case 'CHARGING': return 'green';
                case 'ERROR': return 'red';
                case 'MAINTENANCE': return 'orange';
                case 'DISCONNECTED': return 'gray';
                default: return 'gray';
            }
        }

        async function startCharge(cpId) {
            try {
                const response = await fetch('/api/start_charge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cp_id: cpId })
                });
                const data = await response.json();
                if (response.ok) {
                    updateDashboard(); // Refresh immediately
                } else {
                    alert('Failed to start charge: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error starting charge:', error);
                alert('Error starting charge: ' + error);
            }
        }

        async function stopCharge(cpId) {
            try {
                const response = await fetch('/api/stop_charge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cp_id: cpId })
                });
                const data = await response.json();
                if (response.ok) {
                    updateDashboard(); // Refresh immediately
                } else {
                    alert('Failed to stop charge: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error stopping charge:', error);
                alert('Error stopping charge: ' + error);
            }
        }

        async function revokeKey(cpId) {
            if (!confirm('Are you sure you want to revoke the key for ' + cpId + '? This will disconnect the CP.')) return;
            try {
                const response = await fetch('/api/revoke_key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cp_id: cpId })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Key revoked. CP should disconnect.');
                    updateDashboard();
                } else {
                    alert('Failed to revoke key: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error revoking key:', error);
                alert('Error revoking key: ' + error);
            }
        }

        async function updateDashboard() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Update CPs
                let html = '<h2>Charging Points</h2><table><thead><tr><th>CP ID</th><th>Location</th><th>Temp (ºC)</th><th>Status</th><th>Actions</th></tr></thead><tbody>';

                if (data.cps) {
                    data.cps.forEach(cp => {
                        const color = getStatusColor(cp.status);

                        let actions = '';
                        if (cp.status === 'CONNECTED') {
                            actions = `<button onclick="startCharge('${cp.id}')" style="background-color: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-right: 5px;">Start</button>`;
                            actions += `<button onclick="revokeKey('${cp.id}')" style="background-color: #6c757d; color: white; border: none; padding: 5px 10px; cursor: pointer;">Revoke</button>`;
                        } else if (cp.status === 'CHARGING') {
                            actions = `<button onclick="stopCharge('${cp.id}')" style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-right: 5px;">Stop</button>`;
                            actions += `<button onclick="revokeKey('${cp.id}')" style="background-color: #6c757d; color: white; border: none; padding: 5px 10px; cursor: pointer;">Revoke</button>`;
                        } else if (cp.status === 'AVAILABLE') {
                            actions = `<button onclick="revokeKey('${cp.id}')" style="background-color: #6c757d; color: white; border: none; padding: 5px 10px; cursor: pointer;">Revoke</button>`;
                        } else {
                            actions = '-';
                        }

                        html += `<tr>
                            <td>${cp.id}</td>
                            <td>${cp.location}</td>
                            <td>${cp.temp}</td>
                            <td><span class="status-dot ${color}"></span>${cp.status}</td>
                            <td>${actions}</td>
                        </tr>`;
                    });
                }
                html += '</tbody></table>';

                // Update Alerts
                html += '<h2>Weather Alerts</h2>';
                if (data.alerts && data.alerts.length > 0) {
                    html += '<ul>';
                    data.alerts.forEach(alert => {
                        html += `<li style="color: red;"><strong>${alert.type}</strong> in ${alert.city}</li>`;
                    });
                    html += '</ul>';
                } else {
                    html += '<p>No active alerts.</p>';
                }

                document.getElementById('dashboard').innerHTML = html;

                // Update Logs
                let logsHtml = '<h2>System Logs</h2><table><thead><tr><th>Timestamp</th><th>Action</th><th>Description</th><th>Source IP</th></tr></thead><tbody>';
                try {
                    const logResp = await fetch('/api/logs');
                    const logData = await logResp.json();
                    if (logData.logs) {
                        logData.logs.forEach(log => {
                            logsHtml += `<tr>
                                <td>${log.timestamp}</td>
                                <td>${log.action}</td>
                                <td>${log.description}</td>
                                <td>${log.source_ip}</td>
                            </tr>`;
                        });
                    }
                } catch (e) {
                    console.error('Error fetching logs:', e);
                }
                logsHtml += '</tbody></table>';
                document.getElementById('dashboard').innerHTML += logsHtml;

                // Update Tickets
                let ticketsHtml = '<h2>Recent Tickets</h2><table><thead><tr><th>CP ID</th><th>User</th><th>Start</th><th>End</th><th>kWh</th><th>Cost (€)</th></tr></thead><tbody>';
                try {
                    const ticketResp = await fetch('/api/tickets');
                    const ticketData = await ticketResp.json();
                    if (ticketData.tickets) {
                        ticketData.tickets.forEach(t => {
                            ticketsHtml += `<tr>
                                <td>${t.cp_id}</td>
                                <td>${t.user_id}</td>
                                <td>${t.start_time}</td>
                                <td>${t.end_time}</td>
                                <td>${t.total_kwh}</td>
                                <td>${t.total_cost}</td>
                            </tr>`;
                        });
                    }
                } catch (e) {
                    console.error('Error fetching tickets:', e);
                }
                ticketsHtml += '</tbody></table>';
                document.getElementById('dashboard').innerHTML += ticketsHtml;

            } catch (error) {
                console.error('Error fetching status:', error);
                document.getElementById('dashboard').innerHTML = 'Error loading data.';
            }
        }

        // Update every 2 seconds
        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>

</html>
